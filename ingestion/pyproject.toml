[project]
name = "ingestion"
version = "0.1.0"
description = "Job Ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "hazm>=0.12.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "psycopg[binary]>=3.3.4",
    "py-mini-racer>=0.6.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "regex>=2026.7.19",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

